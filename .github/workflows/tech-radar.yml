name: Tech Radar Daily Scan

on:
  schedule:
    # 23:00 UTC = 06:00 giờ Việt Nam (UTC+7) hàng ngày
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      max_candidates:
        description: 'Số lượng ứng viên tối đa gửi cho AI (mặc định theo config)'
        required: false
        default: ''
      skip_seen:
        description: 'Bỏ qua kiểm tra URL đã quét (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: tech-radar-scan
  cancel-in-progress: false

jobs:
  scan-and-publish:
    name: Quét nguồn công nghệ & Biên tập AI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tech Radar pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_CANDIDATES: ${{ github.event.inputs.max_candidates }}
          SKIP_SEEN: ${{ github.event.inputs.skip_seen }}
        run: |
          ARGS=""
          if [ -n "$MAX_CANDIDATES" ]; then
            ARGS="$ARGS --max-candidates $MAX_CANDIDATES"
          fi
          if [ "$SKIP_SEEN" = "true" ]; then
            ARGS="$ARGS --skip-seen"
          fi
          python scripts/main.py $ARGS

      - name: Commit and push updated data
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain data/)" ]; then
            echo "Không có thay đổi trong thư mục data/. Bỏ qua bước commit."
            exit 0
          fi

          git add data/
          TIMESTAMP=$(TZ="Asia/Ho_Chi_Minh" date "+%Y-%m-%d %H:%M ICT")
          git commit -m "chore(data): update Tech Radar feed ($TIMESTAMP)"
          git push
